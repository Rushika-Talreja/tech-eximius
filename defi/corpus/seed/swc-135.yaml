summary: >
  Some statements do nothing, such as a comparison whose result is discarded or
  an assignment that is never used. Such lines usually show that the author
  intended a different effect and the code does not deliver it.
root_cause: >
  A typing slip or misunderstanding, for example using a comparison operator
  where an assignment was meant, leaves a line that has no impact on state or
  control flow.
exploit_pattern: >
  The missing effect leaves a safeguard or state update silently absent. An
  attacker exploits the behaviour the developer believed was in place, such as
  a check that never actually runs.
remediation: >
  Treat compiler warnings about unused or ineffective statements as errors.
  Review each flagged line to confirm what was intended, then fix or remove it.
