doc_id: swc-116
kind: swc
title: Block Values as a Proxy for Time
vuln_class: [timestamp-dependence]   # provisional, needs agreed class
swc_ids: [SWC-116]
cwe_ids: [CWE-829]
source_url: https://swcregistry.io/docs/SWC-116
license: MIT
date: null
loss_usd: null
summary: >
  Block timestamps and block numbers are used to measure time or to gate
  logic. These values are only loosely controlled by the network, and the
  party producing the block has some freedom over them.
root_cause: >
  Security-relevant decisions such as deadlines, unlocks or randomness depend
  on block.timestamp or block.number as if they were exact and tamper-proof.
exploit_pattern: >
  A block producer nudges the timestamp within the allowed range to cross a
  deadline or tip a close outcome in their favour. Assumptions about how long a
  block takes can also be wrong across chains.
remediation: >
  Do not rely on fine-grained timing for critical logic. Allow tolerance
  around deadlines, avoid timestamps as a randomness source, and be careful
  with block-number-based time assumptions on different chains.
