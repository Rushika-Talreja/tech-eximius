summary: >
  Reentrancy is a vulnerability where a contract makes an external call to an
  untrusted address before it has finished updating its own state. If the
  recipient is a contract, it can use the call to re-enter the calling contract
  (directly or through a chain of calls) and execute the same function again
  while the first invocation is still in progress. Because the state that should
  have recorded the first interaction has not been updated yet, the attacker can
  repeat an operation that was only meant to happen once, such as withdrawing a
  balance many times before it is ever reduced to zero. This lets an attacker
  drain funds or manipulate accounting that depends on the assumption that a
  function will not be interrupted and re-executed mid-way.
root_cause: >
  The root cause is a violation of the checks-effects-interactions ordering
  combined with the EVM's synchronous, single-threaded execution model. During
  an external call, control is handed to the callee, and the callee can call
  back into the current contract before the caller resumes. Any state change
  that the caller intended to make after the external call (for example, zeroing
  a user's balance, marking a withdrawal as claimed, or decrementing a counter)
  is therefore visible to the re-entrant call and its state is still the stale,
  pre-update value. Solidity provides no automatic protection against this, and
  callbacks such as plain ETH transfers via call/transfer, ERC721/ERC1155 hooks,
  and arbitrary external calls introduced by patterns like "withdraw then
  notify" all create a window. Single-function reentrancy, cross-function
  reentrancy (where a second function trusts the same stale state), and
  cross-contract reentrancy (where a shared state across several contracts is
  read inconsistently) are all instances of the same underlying ordering flaw.
exploit_pattern: >
  A typical exploit follows a fixed sequence. First, the attacker deploys a
  malicious contract whose receive or fallback function, or a callback hook,
  calls back into the vulnerable contract. Second, the attacker triggers the
  vulnerable function, usually a withdraw or claim path, which performs its
  external transfer to the attacker before updating internal balances. Third,
  the external call invokes the attacker's callback with the contract still in
  its pre-update state, so the attacker's re-entrant call sees the original
  balance as still available. Fourth, the attacker repeats the withdraw within
  the callback, receiving funds again and again, either through recursion or a
  loop, until the vulnerable contract's balance is drained or a desired
  accounting state is achieved. Finally, the attacker unwinds the call stack,
  and the stale state updates from the outer call execute last, leaving the
  ledger inconsistent with the funds actually removed.
remediation: >
  Apply the checks-effects-interactions pattern: perform all validation first,
  update every piece of internal state that reflects the interaction, and only
  then make the external call. Where a sequence of external interactions must
  happen, use a reentrancy guard (a nonReentrant modifier or an equivalent
  mutex flag) to prevent a function or an entire contract from being entered
  again while a call is in flight, and consider guarding all state-touching
  entry points, not just the one that made the original call. Prefer sending
  value with transfer or a carefully bounded call and avoid handing control to
  untrusted addresses more than necessary; where callbacks are unavoidable,
  validate the callee and account for the fact that it may re-enter. Additional
  hardening includes pulling payments rather than pushing them, using
  pull-based claim patterns, restricting who may be called, and adding tests
  that model malicious re-entrant callees. Pulling these together, the
  invariants to preserve are that state is consistent at every point where
  control can leave the contract and that no external caller can observe an
  intermediate, partially updated state.
