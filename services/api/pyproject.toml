[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "auditor-api"
version = "0.1.0"
description = "FastAPI service for DeFi Contract Auditor"
requires-python = ">=3.12"
dependencies = [
    "auditor-schemas",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "redis>=5.0,<6",
    "arq>=0.26,<1",
    "python-jose[cryptography]>=3.3,<4",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
    "boto3>=1.34,<2",
    "structlog>=24,<25",
    "opentelemetry-api>=1.24,<2",
    "opentelemetry-sdk>=1.24,<2",
    "slowapi>=0.1.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "mypy>=1.10",
    "ruff>=0.4",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
