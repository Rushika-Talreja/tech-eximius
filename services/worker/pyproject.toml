[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "auditor-worker"
version = "0.1.0"
description = "Arq worker for DeFi Contract Auditor pipeline"
requires-python = ">=3.12"
dependencies = [
    "auditor-schemas",
    "auditor-core",
    "auditor-api",
    "arq>=0.26,<1",
    "redis>=5.0,<6",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "asyncpg>=0.29,<1",
    "pydantic-settings>=2.3,<3",
    "structlog>=24,<25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.mypy]
strict = true
python_version = "3.12"

