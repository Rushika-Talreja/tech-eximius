[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "auditor-core"
version = "0.1.0"
description = "Core analysis, privilege map, RAG, and verification library"
requires-python = ">=3.12"
dependencies = [
    "auditor-schemas",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "tree-sitter>=0.21.3",
    "tree-sitter-solidity>=1.2.0",
    "PyYAML>=6.0",
    "fastembed==0.9.1",
    "qdrant-client==1.20.0",
    "structlog>=24.1.0",
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
]

[project.scripts]
auditor-corpus = "auditor_core.rag.corpus_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["auditor_core*"]

[tool.mypy]
strict = true
python_version = "3.12"

