[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "auditor-core"
version = "0.1.0"
description = "Core analysis, privilege map, RAG, and verification library"
requires-python = ">=3.12"
dependencies = [
    "auditor-schemas",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.mypy]
strict = true
python_version = "3.12"

