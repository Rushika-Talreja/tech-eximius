summary: >
  Saddle Finance lost about 10 million dollars from one of its pools through a
  flaw in a swap-related contract.
root_cause: >
  A helper contract for metapools used a calculation that could be exploited
  to receive more tokens than were paid.
exploit_pattern: >
  Run the vulnerable swap path with specific amounts so the output is larger
  than fair value.
