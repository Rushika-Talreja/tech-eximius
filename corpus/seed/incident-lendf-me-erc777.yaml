doc_id: incident-lendf-me-erc777
kind: incident
title: Lendf.Me ERC777 reentrancy
vuln_class: [reentrancy]
swc_ids: [SWC-107]
cwe_ids: []
source_url: null
license: null
date: "2020-04-19"
loss_usd: 25000000
summary: >
  The Lendf.Me lending market lost about 25 million dollars through a callback
  on an ERC777 token.
root_cause: >
  The supply function updated the user's balance after the token transfer,
  which could call back into the market.
exploit_pattern: >
  The attacker supplies an ERC777 token, re-enters during the transfer, and
  withdraws more than was deposited.
