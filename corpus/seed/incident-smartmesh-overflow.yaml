doc_id: incident-smartmesh-overflow
kind: incident
title: SmartMesh SMT proxy transfer overflow
vuln_class: [arithmetic]
swc_ids: [SWC-101]
cwe_ids: []
source_url: null
license: null
date: "2018-04-24"
loss_usd: null
summary: >
  An overflow in the SMT token's proxy transfer function created a very large
  token balance for the attacker.
root_cause: >
  Adding two user-controlled values without overflow checks produced a small
  number that passed the balance requirement.
exploit_pattern: >
  Pass fee and value inputs that wrap around, so the sender's balance check
  succeeds and recipients receive the large value.
