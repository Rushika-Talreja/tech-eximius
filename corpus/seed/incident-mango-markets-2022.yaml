doc_id: incident-mango-markets-2022
kind: incident
title: Mango Markets oracle manipulation
vuln_class: [oracle-manipulation]
swc_ids: []
cwe_ids: []
source_url: null
license: null
date: "2022-10-11"
loss_usd: 110000000
summary: >
  An attacker raised the price of MNGO on thin markets and borrowed against it
  to take about 110 million dollars from Mango Markets.
root_cause: >
  The platform valued collateral using a price from low-liquidity markets that
  one trader could move.
exploit_pattern: >
  Buy a large perpetual position to push the price up, borrow against the
  inflated collateral, and withdraw.
