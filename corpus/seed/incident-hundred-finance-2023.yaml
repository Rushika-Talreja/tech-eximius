date: "2023-04-15"
loss_usd: 7000000
summary: >
  Hundred Finance lost around 7 million dollars on Optimism through an empty-
  market manipulation involving a token with callbacks.
root_cause: >
  A newly empty market could have its exchange rate inflated through
  donations, and a callback token allowed reentry.
exploit_pattern: >
  Inflate the share price with a donation, borrow against it, and re-enter
  during the token transfer.
