doc_id: incident-penpie-2024
kind: incident
title: Penpie reentrancy
vuln_class: [reentrancy]
swc_ids: [SWC-107]
cwe_ids: []
source_url: null
license: null
date: "2024-09-03"
loss_usd: 27000000
summary: >
  Penpie lost about 27 million dollars when an attacker used a fake market to
  re-enter reward functions.
root_cause: >
  The reward claim function lacked a reentrancy guard and trusted a
  permissionless market.
exploit_pattern: >
  Register a malicious market, re-enter during a claim, and receive inflated
  rewards.
