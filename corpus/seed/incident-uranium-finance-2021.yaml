doc_id: incident-uranium-finance-2021
kind: incident
title: Uranium Finance swap constant error
vuln_class: [logic-error]
swc_ids: [SWC-129]
cwe_ids: []
source_url: null
license: null
date: "2021-04-28"
loss_usd: 50000000
summary: >
  A migration of Uranium's swap pairs introduced a wrong constant that let
  attackers take tokens from the pools.
root_cause: >
  The fee-adjusted invariant check used inconsistent constants, so the pool
  accepted swaps that took out far more than was paid in.
exploit_pattern: >
  Perform swaps whose outputs pass the flawed check but exceed the fair
  amount, repeating until pools are emptied.
