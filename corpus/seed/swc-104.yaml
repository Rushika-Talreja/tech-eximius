doc_id: swc-104
kind: swc
title: Unchecked Call Return Value
vuln_class: [unchecked-call]   # provisional
swc_ids: [SWC-104]
cwe_ids: [CWE-252]
source_url: https://swcregistry.io/docs/SWC-104
license: MIT
date: null
loss_usd: null
summary: >
  Low-level calls such as call, send and delegatecall report failure through a
  boolean result instead of reverting. If the contract ignores that result, it
  carries on as though the call worked.
root_cause: >
  The return value of a low-level call is never tested. The contract updates
  its own records on the assumption that the transfer or external action
  succeeded.
exploit_pattern: >
  An attacker uses a recipient that rejects payments or runs out of gas. The
  call fails quietly, yet the contract marks the payout as done, so funds or
  entitlements end up out of sync with reality.
remediation: >
  Always check the boolean result of low-level calls and revert on failure.
  Prefer patterns that revert automatically, and keep state updates consistent
  with the actual outcome of the call.
