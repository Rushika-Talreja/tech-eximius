kind: incident
title: Harmony Horizon bridge key compromise
vuln_class: [key-compromise, centralization-risk]
swc_ids: []
cwe_ids: []
source_url: null
license: null
date: "2022-06-23"
loss_usd: 100000000
summary: >
  The Harmony Horizon bridge lost about 100 million dollars after attackers
  obtained enough multisig keys.
root_cause: >
  The bridge required only two of five signatures, so a small number of
  compromised keys was enough.
exploit_pattern: >
  Use stolen keys to sign withdrawals and move assets off the bridge.
