source_url: https://rekt.news/bent-finance-rekt/
license: CC-BY-4.0
date: "2021-12-21"
loss_usd: 1750000
summary: >
  Bent Finance, a DeFi yield booster protocol, was exploited for approximately $1.75M in December
  2021 through an insider manipulation of the staking contract. The attacker (suspected to be an
  insider or someone with privileged access) modified the reward accounting contract to return
  falsely inflated balance values for a specific address, then claimed outsized staking rewards
  based on the fake balances. Analysis showed the exploiting address was connected to the
  Bent Finance development team.
root_cause: >
  The Bent Finance reward calculation relied on a MultiPoolCvxLocker contract that reported
  locked balances for users. The contract was upgradeable and/or configurable by privileged
  addresses. The attacker (who had access to privileged keys) modified the balance reporting
  function to return an artificially inflated balance for their address. The staking reward
  contract used this inflated balance to calculate and distribute outsized rewards to the attacker.
exploit_pattern: >
  Step 1: The exploiter (suspected insider) uses privileged access to modify the MultiPoolCvxLocker
  balance reporting contract. Step 2: The modification causes the contract to return a falsely
  high locked balance for the attacker's address (e.g., 1000x the actual balance). Step 3:
  The Bent Finance reward distribution reads this inflated balance and calculates proportionally
  huge rewards for the attacker. Step 4: Attacker claims all accumulated rewards based on the
  fake balance, draining the reward pool. Step 5: Community detects anomalous reward claims
  and investigates, discovering the manipulation.
remediation: >
  Use immutable or strictly governed reward accounting contracts with timelocked upgrades.
  Require multi-signature approval for any changes to balance reporting or reward calculation
  contracts. Implement on-chain invariant checks: total rewards distributed must match total
  rewards generated by legitimate stakes. Monitor for unusual reward claim patterns relative
  to stake size. Conduct regular reconciliation of on-chain balances against expected values.
  Use decentralized oracles for balance reporting rather than admin-controlled contracts.
