kind: incident
title: BeautyChain batchTransfer overflow
vuln_class: [arithmetic]
swc_ids: [SWC-101]
cwe_ids: []
source_url: null
license: null
date: "2018-04-22"
loss_usd: null
summary: >
  An integer overflow in a batch transfer function let an attacker credit
  themselves an enormous amount of BEC tokens.
root_cause: >
  A multiplication of amount by receiver count was unchecked and wrapped to a
  tiny number, which passed the balance check.
exploit_pattern: >
  Call the batch function with huge values so the total overflows while each
  receiver is still credited the large amount.
