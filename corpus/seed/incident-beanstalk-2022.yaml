doc_id: incident-beanstalk-2022
kind: incident
title: Beanstalk governance flash loan
vuln_class: [governance, flash-loan]
swc_ids: []
cwe_ids: []
source_url: null
license: null
date: "2022-04-17"
loss_usd: 182000000
summary: >
  An attacker used a flash loan to gain majority voting power in Beanstalk and
  passed a proposal that sent funds to themselves.
root_cause: >
  Voting power was measured at the moment of voting and an emergency execution
  path allowed immediate execution of a proposal.
exploit_pattern: >
  Borrow tokens to hold a voting majority, vote and execute a malicious
  proposal in one transaction, then repay.
