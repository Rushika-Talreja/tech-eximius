date: "2023-03-13"
loss_usd: 197000000
summary: >
  Euler Finance lost about 197 million dollars, and most of the funds were
  later returned.
root_cause: >
  A donation function lowered a user's collateral without running the health
  check, enabling an unhealthy but unflagged position.
exploit_pattern: >
  Use a flash loan to build a leveraged position, donate to cause bad debt,
  then liquidate yourself at a profit.
