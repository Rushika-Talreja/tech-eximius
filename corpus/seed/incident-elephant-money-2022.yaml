doc_id: incident-elephant-money-2022
kind: incident
title: Elephant Money flash loan attack
vuln_class: [oracle-manipulation, flash-loan]
swc_ids: []
cwe_ids: []
source_url: null
license: null
date: "2022-04-12"
loss_usd: 22000000
summary: >
  Elephant Money lost around 22 million dollars to a flash loan that
  manipulated the price used for minting.
root_cause: >
  A mint function relied on a spot price that could be shifted inside a single
  transaction.
exploit_pattern: >
  Shift the pool price with borrowed funds, mint at the distorted rate, sell
  the minted tokens, and repay.
