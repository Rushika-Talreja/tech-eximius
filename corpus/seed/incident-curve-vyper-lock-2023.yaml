summary: >
  Several Curve pools were drained because certain Vyper compiler versions
  broke the reentrancy lock.
root_cause: >
  The compiler produced code in which the reentrancy guard did not actually
  protect the function.
exploit_pattern: >
  Re-enter the liquidity function through a callback during ether transfer.
