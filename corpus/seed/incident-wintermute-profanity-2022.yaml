doc_id: incident-wintermute-profanity-2022
kind: incident
title: Wintermute Profanity vanity address key
vuln_class: [weak-randomness]
swc_ids: [SWC-120]
cwe_ids: []
source_url: null
license: null
date: "2022-09-20"
loss_usd: 160000000
summary: >
  A market maker's wallet was emptied after its private key was recovered from
  a vanity address tool with weak randomness.
root_cause: >
  The address generator produced keys from a small search space, so the
  private key could be reconstructed.
exploit_pattern: >
  Brute-force the key from the public address and sign transfers out of the
  wallet.
