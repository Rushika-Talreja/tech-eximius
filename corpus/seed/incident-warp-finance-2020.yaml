doc_id: incident-warp-finance-2020
kind: incident
title: Warp Finance LP price manipulation
vuln_class: [oracle-manipulation, flash-loan]
swc_ids: []
cwe_ids: []
source_url: null
license: null
date: "2020-12-17"
loss_usd: 7700000
summary: >
  Warp Finance was drained by inflating the value of liquidity tokens used as
  collateral.
root_cause: >
  Collateral value was computed from pool reserves that a flash loan could
  shift.
exploit_pattern: >
  Skew the pool, borrow against the inflated collateral value, then unwind the
  pool and repay the flash loan.
