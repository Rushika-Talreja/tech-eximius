doc_id: incident-transit-swap-2022
kind: incident
title: Transit Swap arbitrary call
vuln_class: [unchecked-calls]
swc_ids: [SWC-112]
cwe_ids: []
source_url: null
license: null
date: "2022-10-01"
loss_usd: 21000000
summary: >
  Transit Swap users lost about 21 million dollars after an attacker used the
  router to make calls on their behalf.
root_cause: >
  The router accepted caller-supplied call data and target addresses without
  restricting them, and users had approved the router.
exploit_pattern: >
  Craft a swap that makes the router call token transferFrom on users who gave
  it approval.
