summary: >
  BurgerSwap lost millions through a flash loan combined with a fake token
  path in its pools.
root_cause: >
  The swap logic did not verify that token pairs and reserves were trustworthy
  before using them to price trades.
exploit_pattern: >
  Use a fake token and borrowed funds to skew reserves, trade against the
  distorted state, then repay.
