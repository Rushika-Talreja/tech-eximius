summary: >
  A function is called with inputs or in a state that its callee does not
  allow, so a require condition fails and the call reverts.
root_cause: >
  A caller does not respect the preconditions of the function it uses, or the
  contract allows external input that cannot satisfy those conditions.
exploit_pattern: >
  External input that always fails a requirement inside a shared flow causes
  the whole operation to revert, blocking users or other logic.
