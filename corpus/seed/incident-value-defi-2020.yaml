doc_id: incident-value-defi-2020
kind: incident
title: Value DeFi pool price manipulation
vuln_class: [oracle-manipulation, flash-loan]
swc_ids: []
cwe_ids: []
source_url: null
license: null
date: "2020-11-14"
loss_usd: 6000000
summary: >
  Value DeFi lost several million dollars when a flash loan was used to
  distort a pool the protocol relied on.
root_cause: >
  A vault pricing step trusted a pool state that could be changed inside the
  same transaction.
exploit_pattern: >
  Borrow, distort the pool, trigger the vault action at the wrong price,
  restore the pool, repay.
