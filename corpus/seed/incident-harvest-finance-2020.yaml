doc_id: incident-harvest-finance-2020
kind: incident
title: Harvest Finance price manipulation
vuln_class: [oracle-manipulation, flash-loan]
swc_ids: []
cwe_ids: []
source_url: null
license: null
date: "2020-10-26"
loss_usd: 24000000
summary: >
  Harvest vault share prices were manipulated using flash loans and a Curve
  stablecoin pool, letting an attacker withdraw more than deposited.
root_cause: >
  The vault valued its holdings from a pool price that could be moved within
  one transaction.
exploit_pattern: >
  Skew the pool with borrowed funds, deposit at the low price, restore the
  pool, then withdraw at the corrected price.
