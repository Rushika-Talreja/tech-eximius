doc_id: incident-poly-network-2021
kind: incident
title: Poly Network cross-chain theft
vuln_class: [access-control]
swc_ids: []
cwe_ids: []
source_url: null
license: null
date: "2021-08-10"
loss_usd: 611000000
summary: >
  An attacker took more than 600 million dollars across several chains from
  the Poly Network bridge, most of which was later returned.
root_cause: >
  A cross-chain call could be crafted to change the keeper role, which let the
  attacker authorize their own withdrawals.
exploit_pattern: >
  Send a message that calls a privileged function replacing the trusted
  keeper, then sign withdrawals as the new keeper.
