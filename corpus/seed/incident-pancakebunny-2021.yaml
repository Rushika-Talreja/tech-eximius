doc_id: incident-pancakebunny-2021
kind: incident
title: PancakeBunny flash loan price manipulation
vuln_class: [oracle-manipulation, flash-loan]
swc_ids: []
cwe_ids: []
source_url: null
license: null
date: "2021-05-20"
loss_usd: 45000000
summary: >
  PancakeBunny's reward token was minted in huge quantity after the attacker
  distorted a price it depended on.
root_cause: >
  The reward calculation used a pool price that could be moved by a flash loan
  in the same transaction.
exploit_pattern: >
  Skew the pool, trigger reward minting at the distorted rate, sell the minted
  tokens, and repay the loan.
