doc_id: incident-dforce-reentrancy
kind: postmortem
title: "dForce / Lendf.me ERC-777 Reentrancy"
vuln_class:
  - reentrancy
swc_ids:
  - SWC-107
cwe_ids:
  - CWE-841
source_url: https://rekt.news/dforce-rekt/
license: CC-BY-4.0
date: "2020-04-19"
loss_usd: 25000000
summary: >
  dForce's Lendf.me lending protocol was drained of approximately $25M in April 2020 through
  a reentrancy attack using imBTC, an ERC-777 wrapped Bitcoin token. The ERC-777 standard's
  tokensReceived hook allowed the attacker to reenter Lendf.me's supply function and manipulate
  collateral balances. This incident, which occurred just one day after the Uniswap imBTC
  exploit, highlighted the systemic risk of ERC-777 tokens in DeFi lending protocols.
root_cause: >
  ERC-777 tokens call a tokensReceived hook on the recipient during token transfers. Lendf.me's
  supply function transferred imBTC tokens to the contract and then updated the user's supply
  balance, but the tokensReceived hook was called before the balance update. This allowed
  an attacker's malicious contract to reenter the supply function during the hook call,
  recording inflated supply balances that didn't correspond to real deposits.
exploit_pattern: >
  Step 1: Attacker deploys a malicious contract implementing the ERC-777 tokensReceived hook.
  Step 2: Attacker calls supply() on Lendf.me with imBTC. Step 3: During token transfer,
  Lendf.me calls tokensReceived on the attacker's contract (per ERC-777 spec). Step 4: Attacker's
  hook reenters the supply() function, which records another supply without requiring tokens.
  Step 5: Attacker now has inflated collateral recorded on Lendf.me. Step 6: Attacker withdraws
  all other assets from the protocol against the fictitious collateral, draining $25M.
  (Most funds were later returned after the attacker was identified through KYC on a CEX.)
remediation: >
  Never list ERC-777 tokens in lending protocols without specialized reentrancy handling.
  Use nonReentrant guards on all supply, borrow, withdraw, and liquidation functions. Update
  internal state (balance records) before any external token transfers or calls. Maintain a
  token allowlist for lending markets that explicitly excludes tokens with callbacks. Audit
  all existing DeFi integrations when new token standards with hooks are introduced.
