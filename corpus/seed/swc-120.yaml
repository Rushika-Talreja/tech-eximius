doc_id: swc-120
kind: swc
title: Weak Sources of Randomness from Chain Attributes
vuln_class: [weak-randomness]   # provisional, needs agreed class
swc_ids: [SWC-120]
cwe_ids: [CWE-330]
source_url: https://swcregistry.io/docs/SWC-120
license: MIT
date: null
loss_usd: null
summary: >
  A contract derives random numbers from on-chain values such as block
  timestamp, block hash or block number. These values are public and partly
  influenced by the block producer, so the result is predictable.
root_cause: >
  Everything on a blockchain is deterministic and visible, so values taken
  from the chain cannot provide unpredictability for lotteries, games or
  selection logic.
exploit_pattern: >
  An attacker computes the same value inside their own contract in the same
  transaction and only proceeds when the outcome is favourable. A block
  producer can also withhold or reorder blocks to steer the result.
remediation: >
  Use a verifiable randomness service or a commit-reveal scheme with proper
  incentives. Do not use block attributes as the sole source of randomness
  where money is at stake.
