kind: incident
title: KyberSwap Elastic rounding exploit
vuln_class: [arithmetic]
swc_ids: []
cwe_ids: []
source_url: null
license: null
date: "2023-11-22"
loss_usd: 48000000
summary: >
  KyberSwap Elastic pools lost about 48 million dollars through a precision
  flaw in tick math.
root_cause: >
  A rounding error at a price boundary let the pool think liquidity was added
  twice.
exploit_pattern: >
  Make carefully sized swaps that cross a tick boundary so liquidity is
  counted twice, then withdraw the excess.
