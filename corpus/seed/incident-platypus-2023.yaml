date: "2023-02-16"
loss_usd: 8500000
summary: >
  Platypus Finance lost about 8.5 million dollars because a solvency check
  could be passed using an order of operations the authors did not expect.
root_cause: >
  An emergency withdrawal path did not check the account's debt properly
  against collateral.
exploit_pattern: >
  Borrow against collateral, then use emergency withdraw to take the
  collateral while keeping the borrowed funds.
