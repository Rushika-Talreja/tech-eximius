doc_id: swc-102
kind: swc
title: Outdated Compiler Version
vuln_class: [outdated-compiler]
swc_ids: [SWC-102]
cwe_ids: [CWE-937]
source_url: https://swcregistry.io/docs/SWC-102
license: MIT
date: null
loss_usd: null
summary: >
  Building a contract with an old Solidity compiler exposes it to bugs that
  were later found and fixed in newer releases.
root_cause: >
  The pragma or build configuration pins an old compiler that has publicly
  known defects, so the generated bytecode may behave differently from the
  source.
exploit_pattern: >
  A known compiler bug is triggered by a code pattern in the contract,
  producing unexpected behavior that the source code alone would not suggest.
remediation: "Compile with a recent, maintained Solidity compiler version."
