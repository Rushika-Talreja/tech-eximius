doc_id: incident-nomad-bridge-2022
kind: incident
title: Nomad bridge trusted root flaw
vuln_class: [initialization]
swc_ids: []
cwe_ids: []
source_url: null
license: null
date: "2022-08-01"
loss_usd: 190000000
summary: >
  The Nomad bridge lost about 190 million dollars when messages were accepted
  without real proof, and many users copied the attack.
root_cause: >
  An upgrade initialized a trusted root value to zero, so unproven messages
  appeared valid.
exploit_pattern: >
  Copy a working withdrawal transaction and change only the recipient address.
