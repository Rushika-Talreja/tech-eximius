[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defi-auditor"
version = "0.1.0"
description = "DeFi smart-contract audit tooling (corpus ingestion and RAG)."
requires-python = ">=3.10"
dependencies = [
    "PyYAML==6.0.2",
    "fastembed==0.9.1",
    "qdrant-client==1.20.0",
]

[tool.setuptools.packages.find]
where = ["packages/auditor_core", "packages/auditor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/auditor_core", "packages/auditor"]
