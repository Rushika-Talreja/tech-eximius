  # SWC-114: Transaction Order Dependence
  - id: "q54"
    query: "race condition between approve and transferFrom allows allowance to be spent twice"
    targets: ["swc-114"]
  - id: "q55"
    query: "miner or bot observes pending game move and submits winning counter before it mines"
    targets: ["swc-114"]

  # SWC-115: Authorization Through tx.origin
  - id: "q56"
    query: "phishing contract tricks victim into calling it which passes tx.origin check"
    targets: ["swc-115"]
  - id: "q57"
    query: "tx.origin used instead of msg.sender for access control bypassed via intermediary"
    targets: ["swc-115"]

  # SWC-116: Block Values as Proxy for Time
  - id: "q58"
    query: "time-locked release uses block.timestamp that validators can manipulate within bounds"
    targets: ["swc-116"]
  - id: "q59"
    query: "now keyword used as expiry timestamp susceptible to minor miner manipulation"
    targets: ["swc-116"]

  # SWC-117: Signature Malleability
  - id: "q60"
    query: "ECDSA signature verification does not reject the malleable s value form"
    targets: ["swc-117"]
  - id: "q61"
    query: "same message signed once can produce two valid signatures due to elliptic curve symmetry"
    targets: ["swc-117"]
  - id: "q62"
    query: "signature malleability allows replaying a valid signature with flipped S component"
    targets: ["swc-117"]

  # SWC-118: Incorrect Constructor Name
  - id: "q63"
    query: "constructor defined as a regular function with the contract name in Solidity 0.4"
    targets: ["swc-118"]
  - id: "q64"
    query: "ownership never set because constructor function name does not match contract name"
    targets: ["swc-118"]
  - id: "q65"
