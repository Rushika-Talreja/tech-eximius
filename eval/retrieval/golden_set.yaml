version: "1.0"
description: >
  Golden retrieval set for the auditor corpus. Every entry maps an audit-style
  query to the doc_id(s) that should come back. An entry with an empty
  "targets" list is a negative case: no corpus document answers it, so the
  retriever is expected to return no evidence at all.
queries:
  # --- positives: the target document should appear in the top 5 ---

  # q01-q14: original queries (preserved)
  - id: "q01"
    query: "reentrancy withdraw re-enters before the balance is updated"
    targets: ["swc-107"]
  - id: "q02"
    query: "checks-effects-interactions ordering external call stale state"
    targets: ["swc-107"]
  - id: "q03"
    query: "integer overflow wraps around when subtracting below zero"
    targets: ["swc-101"]
  - id: "q04"
    query: "multiplication of a price overflows the fixed size integer"
    targets: ["swc-101"]
  - id: "q05"
    query: "low-level call return value is ignored so a failed send looks successful"
    targets: ["swc-104"]
  - id: "q06"
    query: "public function sends ether out without checking who called it"
    targets: ["swc-105"]
  - id: "q07"
    query: "anyone can call the function that destroys the contract and forwards its balance"
    targets: ["swc-106"]
  - id: "q08"
    query: "failing assert on valid user input locks the contract"
    targets: ["swc-110"]
  - id: "q09"
    query: "delegatecall to a user supplied address overwrites the owner"
    targets: ["swc-112"]
  - id: "q10"
    query: "authorization check compares tx.origin with the owner"
    targets: ["swc-115"]
  - id: "q11"
    query: "front-running a pending transaction with a higher fee"
    targets: ["swc-114"]
  - id: "q12"
    query: "deadline depends on block.timestamp which a miner can nudge"
    targets: ["swc-116"]
  - id: "q13"
    query: "lottery derives randomness from block hash and block number"
    targets: ["swc-120"]
  - id: "q14"
    query: "statement has no effect because the comparison result is discarded"
    targets: ["swc-135"]
  # q15-q18: original negatives (preserved)
  - id: "q15"
    query: "how to write a unit test for a React component"
    targets: []
  - id: "q16"
    query: "best practices for responsive CSS grid layout"
    targets: []
  - id: "q17"
    query: "the history of the roman empire"
    targets: null
  - id: "q18"
    query: "how to brew a good cup of espresso"
    targets: []

  # --- new positives (q19 onward) ---

  # SWC-100: Function Default Visibility
  - id: "q19"
    query: "function visibility not specified defaults to public in older Solidity"
    targets: ["swc-100"]
  - id: "q20"
    query: "unintended public function exposed because visibility keyword was omitted"
    targets: ["swc-100"]
  - id: "q21"
    query: "missing visibility specifier on internal helper allows external callers"
    targets: ["swc-100"]

  # SWC-101: Integer Overflow and Underflow
  - id: "q22"
    query: "uint256 addition wraps to zero when summing two large token balances"
    targets: ["swc-101"]
  - id: "q23"
    query: "unchecked arithmetic causes token supply to underflow on burn"
    targets: ["swc-101"]

  # SWC-102: Outdated Compiler Version
  - id: "q24"
    query: "contract compiled with an old Solidity version containing known bugs"
    targets: ["swc-102"]
  - id: "q25"
    query: "pragma statement pins a compiler version that has unpatched vulnerabilities"
    targets: ["swc-102"]
  - id: "q26"
    query: "using a stale compiler release introduces security issues fixed in later versions"
    targets: ["swc-102"]

  # SWC-103: Floating Pragma
  - id: "q27"
    query: "caret in pragma allows any minor version of the compiler to be used"
    targets: ["swc-103"]
  - id: "q28"
    query: "floating pragma means different developers compile with different Solidity versions"
    targets: ["swc-103"]
  - id: "q29"
    query: "unlocked compiler version via ^0.8.0 pragma makes builds non-deterministic"
    targets: ["swc-103"]

  # SWC-104: Unchecked Call Return Value
  - id: "q30"
    query: "return value of address.call not stored so revert on recipient is silently swallowed"
    targets: ["swc-104"]
  - id: "q31"
    query: "send() return value discarded, failed ether transfer goes unnoticed"
    targets: ["swc-104"]

  # SWC-105: Unprotected Ether Withdrawal
  - id: "q32"
    query: "withdraw function lacks access control and any user can drain the contract"
    targets: ["swc-105"]
  - id: "q33"
    query: "no owner check on payout function allows arbitrary callers to steal ETH"
    targets: ["swc-105"]

  # SWC-106: Unprotected SELFDESTRUCT Instruction
  - id: "q34"
    query: "selfdestruct call is reachable without an ownership guard"
    targets: ["swc-106"]
  - id: "q35"
    query: "missing modifier on suicide function lets attacker permanently destroy contract"
    targets: ["swc-106"]

  # SWC-107: Reentrancy
  - id: "q36"
    query: "ETH transferred before internal accounting updated enabling reentrancy"
    targets: ["swc-107"]
  - id: "q37"
    query: "cross-function reentrancy via shared state not protected by mutex"
    targets: ["swc-107"]

  # SWC-108: State Variable Default Visibility
  - id: "q38"
    query: "state variable declared without visibility modifier is unexpectedly public"
    targets: ["swc-108"]
  - id: "q39"
    query: "sensitive storage slot exposed because visibility keyword omitted on state var"
    targets: ["swc-108"]
  - id: "q40"
    query: "contract storage field defaults to internal visibility when specifier is absent"
    targets: ["swc-108"]

  # SWC-109: Uninitialized Storage Pointer
  - id: "q41"
    query: "local storage pointer declared without assignment aliases slot zero"
    targets: ["swc-109"]
  - id: "q42"
    query: "uninitialized struct in storage overwrites owner variable at slot 0"
    targets: ["swc-109"]
  - id: "q43"
    query: "dangling storage reference corrupts state because pointer is never set"
    targets: ["swc-109"]

  # SWC-110: Assert Violation
  - id: "q44"
    query: "assert used to validate external input instead of require burns remaining gas"
    targets: ["swc-110"]
  - id: "q45"
    query: "invariant check with assert fails on reachable path and reverts with no refund"
    targets: ["swc-110"]

  # SWC-111: Use of Deprecated Solidity Functions
  - id: "q46"
    query: "contract uses throw keyword removed in Solidity 0.5"
    targets: ["swc-111"]
  - id: "q47"
    query: "sha3 called instead of keccak256 which is the current recommended hash function"
    targets: ["swc-111"]
  - id: "q48"
    query: "suicide alias used instead of selfdestruct, a deprecated function in modern Solidity"
    targets: ["swc-111"]

  # SWC-112: Delegatecall to Untrusted Callee
  - id: "q49"
    query: "proxy uses delegatecall with an address taken from calldata without validation"
    targets: ["swc-112"]
  - id: "q50"
    query: "attacker controls implementation address passed to delegatecall gaining code execution"
