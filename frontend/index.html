<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeFi Contract Auditor Platform - Advisory Suite</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#161311',
            surface: '#161311',
            'surface-dim': '#161311',
            'surface-bright': '#3d3836',
            'surface-container-lowest': '#100e0c',
            'surface-container-low': '#1e1b19',
            'surface-container': '#221f1d',
            'surface-container-high': '#2d2927',
            'surface-container-highest': '#383431',
            'surface-variant': '#383431',
            'on-surface': '#e9e1dd',
            'on-surface-variant': '#d5c4af',
            outline: '#9d8e7c',
            'outline-variant': '#514535',
            primary: '#ffbb49',
            'on-primary': '#442c00',
            'primary-container': '#e0a030',
            'on-primary-container': '#583a00',
            secondary: '#d0c5b9',
            'on-secondary': '#362f27',
            'secondary-container': '#4d463d',
            'on-secondary-container': '#beb3a8',
            error: '#d6403a',
            'on-error': '#690005',
            'error-container': '#93000a'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
            'headline-lg': ['Inter', 'sans-serif'],
            'headline-sm': ['Inter', 'sans-serif'],
            'body-md': ['Inter', 'sans-serif'],
            'body-sm': ['Inter', 'sans-serif'],
            'code-lg': ['JetBrains Mono', 'monospace'],
            'code-md': ['JetBrains Mono', 'monospace'],
            'code-sm': ['JetBrains Mono', 'monospace'],
            'label-caps': ['JetBrains Mono', 'monospace'],
            disclaimer: ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>

  <style>
    /* Strict warm styling overrides: zero blue, zero purple */
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      border-color: #3A332D;
    }
    ::selection {
      background: #E0A030 !important;
      color: #14110F !important;
    }
    :focus, :focus-visible {
      outline: 2px solid #E0A030 !important;
      outline-offset: 1px !important;
    }
    a {
      color: #FFBB49;
    }
    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #14110F;
    }
    ::-webkit-scrollbar-thumb {
      background: #3A332D;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #E0A030;
    }
  </style>

  <!-- Monaco Editor AMD Loader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
  <script>
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
    require(['vs/editor/editor.main'], function () {
      console.log('Monaco Editor loaded successfully');
    });
  </script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel Standalone for direct in-browser JSX ES module transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#161311] text-[#E9E1DD] overflow-hidden m-0 p-0 font-sans">
  <div id="root"></div>

  <!-- Main Application Script -->
  <script type="text/babel" data-type="module" src="./src/main.jsx"></script>
</body>
</html>
